<!DOCTYPE html>
<html class="light" lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- Favicon — SVG works in all modern browsers -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="theme-color" content="#006769" />

    <!-- Fonts — loaded as stylesheet not preload to avoid the warning -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" />

    <title>Read Manga Online Free</title>
    <meta name="description" content="Discover and read manga online for free. Updated daily with the latest chapters." />

    <script>
      // Suppress browser extension errors (MetaMask, wallet injectors)
      (function() {
        function isExtErr(m, s, k) {
          var str = (m||'') + ' ' + (s||'') + ' ' + (k||'');
          return str.includes('chrome-extension://') || str.includes('moz-extension://') ||
                 str.includes('MetaMask') || str.includes('inpage.js');
        }
        window.addEventListener('error', function(e) {
          if (isExtErr(e.message, e.filename, e.error && e.error.stack)) { e.preventDefault(); return true; }
        }, true);
        window.addEventListener('unhandledrejection', function(e) {
          var r = e.reason, m = r && (r.message || String(r));
          if (isExtErr(m, '', r && r.stack)) { e.preventDefault(); return true; }
        }, true);
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
